<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0D10">
<title>Bike Nav — Route Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">BIKE NAV</span>
    </div>
    <button id="locate-btn" class="icon-btn" title="Center on my location" aria-label="Center on my location">&#9678;</button>
  </header>

  <div id="toast" class="toast" role="alert" hidden></div>

  <section class="sheet" id="sheet">
    <div class="sheet-grip"></div>

    <div class="search-row">
      <div class="search-field">
        <input type="search" id="start-search-input" class="search-input"
               placeholder="Search start location" autocomplete="off" enterkeyhint="search">
        <button id="start-search-btn" class="search-btn" type="button" aria-label="Search start location">&#128269;</button>
        <ul class="search-results" id="start-search-results" hidden></ul>
      </div>
      <div class="search-field">
        <input type="search" id="end-search-input" class="search-input"
               placeholder="Search end location" autocomplete="off" enterkeyhint="search">
        <button id="end-search-btn" class="search-btn" type="button" aria-label="Search end location">&#128269;</button>
        <ul class="search-results" id="end-search-results" hidden></ul>
      </div>
    </div>

    <p class="instructions" id="instructions">
      Search, or tap the map, to set your <strong class="text-start">start</strong> point.
    </p>

    <div class="telemetry-strip" id="telemetry-strip">
      <div class="telemetry-field">
        <span class="telemetry-label">DIST</span>
        <span class="telemetry-value" id="stat-distance">&mdash;</span>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-field">
        <span class="telemetry-label">TIME</span>
        <span class="telemetry-value" id="stat-time">&mdash;</span>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-field">
        <span class="telemetry-label">PTS</span>
        <span class="telemetry-value" id="stat-points">&mdash;</span>
      </div>
      <div class="telemetry-status" id="telemetry-status" aria-hidden="true"></div>
    </div>

    <div class="button-row">
      <button id="reset-btn" class="btn btn-ghost">Reset</button>
      <button id="plan-btn" class="btn btn-primary" disabled>Plan route</button>
    </div>

    <div class="ble-row">
      <button id="send-btn" class="btn btn-outline" disabled>Send to Bike Computer</button>
      <span class="ble-status" id="ble-status">Not connected</span>
    </div>

    <div class="ride-row">
      <div class="ride-buttons">
        <button id="start-ride-btn" class="btn btn-primary" disabled>Start Ride</button>
        <button id="stop-ride-btn" class="btn btn-danger" disabled>Stop Ride</button>
      </div>
      <span class="ride-status" id="ride-status"></span>
    </div>

    <div class="diagnostic-row">
      <button id="test-gps-btn" class="btn btn-ghost">Test GPS</button>
      <pre class="diagnostic-output" id="gps-diagnostic-output" hidden></pre>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
